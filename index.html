<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>IronLog</title>
  <meta name="description" content="Kişisel gym takip uygulaması">
  <meta name="theme-color" content="#07070a">
  <meta name="color-scheme" content="dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="IronLog">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/logo-180.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/logo-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="app" aria-live="polite"></main>

  <div id="timer" class="timer" hidden>
    <div class="t-bar"><div class="t-fill"></div></div>
    <div class="t-row">
      <div class="t-info">
        <div class="t-label"></div>
        <div class="t-time">0:00</div>
      </div>
      <button class="t-btn" data-act="t-minus" aria-label="15 saniye azalt">−15</button>
      <button class="t-btn" data-act="t-plus" aria-label="15 saniye ekle">+15</button>
      <button class="t-btn t-skip" data-act="t-skip">Geç</button>
    </div>
  </div>

  <nav class="tabs" aria-label="Menü">
    <button data-act="tab" data-tab="train" class="on">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 7.5v9M3.5 10v4M17.5 7.5v9M20.5 10v4M6.5 12h11"/></svg>
      <span>Antrenman</span>
    </button>
    <button data-act="tab" data-tab="history">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>
      <span>Geçmiş</span>
    </button>
    <button data-act="tab" data-tab="track">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h16M7 16v-4M12 16V6M17 16V9"/></svg>
      <span>Takip</span>
    </button>
    <button data-act="tab" data-tab="settings">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5h14v4H5zM5 9v10h14V9M9 13h6"/></svg>
      <span>Veri</span>
    </button>
  </nav>

  <div id="toast" class="toast" role="status" hidden></div>
  <input id="importFile" type="file" accept="application/json,.json" hidden>

  <script src="program.js"></script>
  <script src="app.js"></script>
</body>
</html>
